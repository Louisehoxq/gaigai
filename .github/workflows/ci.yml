name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # package-lock.json is not committed (the project uses bun.lock), so install without a lockfile.
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
